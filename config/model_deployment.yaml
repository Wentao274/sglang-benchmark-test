# 模型部署配置
# 用于生成芯片性能对比报告中的SGLang启动配置信息
# 按芯片类型分组

sglang_configs:
  inspur_MetaX_C550:
    - model_name: MiniMax-M2.5-W8A8
      attention-backend: flashinfer
      quantization: w8a8_int8
      tp_size: 8
      pp_size: 1
      nnodes: 1
      context-length: 196608
      max-running-requests: 64
      max-queued-requests: None
      disable-radix-cache: True
      tool-call-parser: minimax-m2
      reasoning-parser: minimax-append-think
      mem-fraction-static: 0.9
      remarks: 浪潮MetaX_C550 SGLang启动配置
    - model_name: Kimi-K2.5_int4_2
      attention-backend: flashinfer
      quantization: w4a8_int8
      tp_size: 16
      pp_size: 1
      nnodes: 2
      context-length: 262144
      cuda-graph-max-bs: 64
      max-running-requests: 64
      max-queued-requests: None
      chunked-prefill-size: 8192
      disable-radix-cache: True
      tool-call-parser: kimi_k2
      reasoning-parser: kimi_k2
      mem-fraction-static: 0.8
      remarks: 浪潮MetaX_C550 SGLang启动配置
    - model_name: GLM-5-W8A8
      attention-backend: flashinfer
      quantization: w8a8_int8
      tp_size: 16
      dp_size: 4
      pp_size: 1
      nnodes: 2
      context-length: 202752
      cuda-graph-max-bs: 64
      max-running-requests: 64
      max-queued-requests: None
      chunked-prefill-size: 8192
      disable-radix-cache: True
      tool-call-parser: glm47
      reasoning-parser: glm45
      mem-fraction-static: 0.8
      remarks: 浪潮MetaX_C550 SGLang启动配置
  NVIDIA_H100:
    - model_name: MiniMax-M2.5
      tp_size: 8
      dp_size: 1
      pp_size: 1
      ep_size: 8
      context-length: 196608
      cuda-graph-max-bs: 128
      max-running-requests: 64
      chunked-prefill-size: 8192
      dtype: bfloat16
      disable-radix-cache: True
      tool-call-parser: minimax-m2
      reasoning-parser: minimax
      mem-fraction-static: 0.85
      remarks: NVIDIA H100启动配置
  PPU810:
    - model_name: GLM-5.1-W4A8
      attention-backend: nsa
      quantization: mixed_precision_w4
      tp_size: 8
      dp_size: 1
      pp_size: 1
      context-length: 202752
      cuda-graph-max-bs: 64
      max-running-requests: 64
      max-queued-requests: None
      chunked-prefill-size: 8192
      disable-radix-cache: True
      tool-call-parser: glm47
      reasoning-parser: glm45
      mem-fraction-static: 0.89
      remarks: 浪潮MetaX_C550 SGLang启动配置
  tianjin_P800:
    - model_name: MiniMax-M2.5-int8
      attention-backend: kunlun
      tp_size: 8
      dp_size: 1
      pp_size: 1
      ep_size: 8
      context-length: 196608
      cuda-graph-max-bs: 128
      max-running-requests: 64
      chunked-prefill-size: 8192
      dtype: bfloat16
      disable-radix-cache: True
      tool-call-parser: minimax-m2
      reasoning-parser: minimax
      mem-fraction-static: 0.85
      remarks: tianjin_P800启动配置
  hanggang_P800:
    - model_name: MiniMax-M2.5-int8
      attention-backend: kunlun
      tp_size: 8
      dp_size: 1
      pp_size: 1
      ep_size: 8
      context-length: 196608
      cuda-graph-max-bs: 128
      max-running-requests: 64
      chunked-prefill-size: 8192
      dtype: bfloat16
      disable-radix-cache: True
      tool-call-parser: minimax-m2
      reasoning-parser: minimax
      mem-fraction-static: 0.85
      remarks: hanggang_P800启动配置
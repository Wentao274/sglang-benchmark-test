# 模型部署配置
# 用于生成芯片性能对比报告中的SGLang启动配置信息
# 按芯片类型分组

sglang_configs:
  inspur_MetaX_C550:
    - model_name: MiniMax-M2.5-W8A8
      attention-backend: flashinfer
      quantization: w8a8_int8
      tp_size: 8
      pp_size: 1
      nnodes: 1
      context-length: 196608
      max-running-requests: 64
      max-queued-requests: None
      disable-radix-cach: True
      tool-call-parser: minimax-m2
      reasoning-parser: minimax-append-think
      mem-fraction-static: 0.9
      remarks: 浪潮MetaX_C550 SGLang启动配置
    - model_name: Kimi-K2.5_int4_2
      attention-backend: flashinfer
      quantization: w4a8_int8
      tp_size: 16
      pp_size: 1
      nnodes: 2
      context-length: 262144
      cuda-graph-max-bs: 64
      max-running-requests: 64
      max-queued-requests: None
      chunked-prefill-size: 8192
      disable-radix-cach: True
      tool-call-parser: kimi_k2
      reasoning-parser: kimi_k2
      mem-fraction-static: 0.8
      remarks: 浪潮MetaX_C550 SGLang启动配置
    - model_name: GLM-5-W8A8
      attention-backend: flashinfer
      quantization: w8a8_int8
      tp_size: 16
      dp_size: 4
      pp_size: 1
      nnodes: 2
      context-length: 202752
      cuda-graph-max-bs: 64
      max-running-requests: 64
      max-queued-requests: None
      chunked-prefill-size: 8192
      disable-radix-cach: True
      tool-call-parser: glm47
      reasoning-parser: glm45
      mem-fraction-static: 0.8
      remarks: 浪潮MetaX_C550 SGLang启动配置
  NVIDIA_H100:
    - model_name: MiniMax-M2.5
      max-model-len: 196608
      max-num-seqs: 10
      max-num-batched-tokens: 8192
      gpu-memory-utilization: 0.85
      dtype: default
      block_size: default
      dp: 1
      tp: 8
      pp: 1
      enable-export-parallel: True
      enable-auto-tool-choice: True
      tool-call-parser: minimax_m2
      reasoning-parser: minimax_m2
      remarks: 英伟达H100 VLLM启动配置